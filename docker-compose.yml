services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentforge_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/agentforge
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - QDRANT_URL=http://qdrant:6333
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY}
      - ENVIRONMENT=production
    depends_on:
      - db
      - redis
      - qdrant
    restart: always

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentforge_celery_worker
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/agentforge
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - QDRANT_URL=http://qdrant:6333
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY}
      - ENVIRONMENT=production
    depends_on:
      - db
      - redis
      - qdrant
    restart: always

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentforge_celery_beat
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/agentforge
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - QDRANT_URL=http://qdrant:6333
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY}
      - ENVIRONMENT=production
    depends_on:
      - db
      - redis
      - qdrant
    restart: always

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentforge_flower
    command: celery -A app.core.celery_app flower --port=5555
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/agentforge
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - QDRANT_URL=http://qdrant:6333
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY}
      - ENVIRONMENT=production
    depends_on:
      - db
      - redis
      - qdrant
      - celery_worker
    restart: always

  db:
    image: postgres:15
    container_name: agentforge_db
    environment:
      - POSTGRES_DB=agentforge
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: agentforge_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agentforge_qdrant
    restart: always
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
